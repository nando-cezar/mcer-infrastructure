name: CI/CD Auth Service to GKE (prod)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

env:
  GKE_CLUSTER: mcer-cluster
  GKE_ZONE: southamerica-east1-a
  GKE_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
  K8S_NAMESPACE: mcer-core
  IMAGE: ghcr.io/${{ github.repository_owner }}/auth-service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK (needed to build)
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Authenticate to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Docker image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t $IMAGE:$IMAGE_TAG .
          docker push $IMAGE:$IMAGE_TAG

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials $GKE_CLUSTER --zone $GKE_ZONE --project $GKE_PROJECT

      - name: Replace image tag in overlay
        run: |
          # Define IMAGE_TAG env var for kustomize substitution
          export IMAGE_TAG=${{ github.sha }}
          # Build & apply
          kustomize build overlays/prod | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/auth-service -n $K8S_NAMESPACE
