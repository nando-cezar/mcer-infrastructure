apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - /k8s/base/auth-service
  - /k8s/base/user-service
  - /k8s/base/product-service
  - /k8s/base/company-service
  - /k8s/base/geoenergy-service
  - /k8s/base/contract-service
  - /k8s/base/api-gateway
  - /k8s/base/kafka
  - /k8s/base/ingress.yaml

images:
  - name: ghcr.io/<owner>/auth-service
    newTag: "${{ github.sha }}"
  #- name: ghcr.io/<owner>/user-service
  #  newTag: "${{ github.sha }}"
  # etc para cada serviço

commonLabels:
  environment: prod
